<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Memory Game — Mobile App</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  body { margin: 0; font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: 'Space Mono', 'Courier New', monospace; }
  button { font-family: inherit; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F7FA; color: #10151B; overflow: hidden; border: 2px solid #10151B; border-radius: 28px;">
  <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #ffffff; border-bottom: 2px solid #10151B;">
    <div style="font-size: 16px; font-weight: 700;">Memory Game</div>
    <div class="mono" style="font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: #F06DC1; color: #10151B;">01:47</div>
  </div>
  <div style="flex-shrink: 0; padding: 10px 16px; display: flex; gap: 8px; overflow-x: auto;">
    <sc-for list="{{levels}}" as="lvl" hint-placeholder-count="3">
      <button type="button" onClick="{{lvl.pick}}" aria-pressed="{{lvl.isActive}}" style="{{lvl.tabStyle}}">{{lvl.label}}</button>
    </sc-for>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; justify-content: center; align-items: flex-start;">
    <div style="width: 100%; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px;">
      <sc-for list="{{cards}}" as="card" hint-placeholder-count="16">
        <div style="{{card.cardStyle}}">
          <sc-if value="{{card.isFaceUp}}" hint-placeholder-val="{{true}}">
            <img src="{{card.img}}" alt="Carte {{card.value}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; transform: scale(1.45); transform-origin: center;">
          </sc-if>
          <sc-if value="{{card.isBack}}" hint-placeholder-val="{{false}}">
            <span style="{{card.backMark}}"></span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="height: 76px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: #ffffff; border-top: 2px solid #10151B;">
    <div>
      <div style="font-size: 11px; font-weight: 600; color: #5B6472; text-transform: uppercase; letter-spacing: .06em;">Score</div>
      <div class="mono" style="margin-top: 4px; display: inline-flex; padding: 4px 10px; border-radius: 999px; background: #FEC400; color: #10151B; font-weight: 700; font-size: 14px;"><span>★★★</span><span style="color:rgba(16,21,27,.35)">☆☆</span> 920</div>
    </div>
    <button type="button" style="min-height: 44px; padding: 10px 18px; border-radius: 4px; font-size: 14px; font-weight: 700; cursor: pointer; background: #0E4793; color: #ffffff; border: 2px solid #0E4793;">Rejouer</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { level: 3 };
  }
  renderVals() {
    const levelDefs = [
      { id: 1, label: 'Niveau 1', cards: 12, color: '#029ADB', textOnActive: '#10151B' },
      { id: 2, label: 'Niveau 2', cards: 36, color: '#019A46', textOnActive: '#10151B' },
      { id: 3, label: 'Niveau 3', cards: 48, color: '#0E4793', textOnActive: '#ffffff' },
    ];
    const levels = levelDefs.map((l) => {
      const isActive = l.id === this.state.level;
      const tabStyle = isActive
        ? `min-height:44px;box-sizing:border-box;flex-shrink:0;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;background:${l.color};color:${l.textOnActive};border:2px solid ${l.color};white-space:nowrap`
        : `min-height:44px;box-sizing:border-box;flex-shrink:0;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;background:#ffffff;color:#10151B;border:2px solid ${l.color};white-space:nowrap`;
      return { ...l, isActive, tabStyle, pick: () => this.setState({ level: l.id }) };
    });
    const current = levelDefs.find((l) => l.id === this.state.level) ?? levelDefs[1];
    const CARD_IMAGES = [
      '/_blob/7deaf84207b83974956cce991441dfa9',
      '/_blob/b89067a2c9716915e4452cd79cd273f8',
      '/_blob/f60ea30670ed92fb430c18b602e822df',
      '/_blob/3b233e1af9f14fe39d6ef3946096eb57',
      '/_blob/a3d58f842e52fe042e910b6aa4b6b2d4',
      '/_blob/68ba06e2d0e5de3e8ae72abf2794fe00',
      '/_blob/7354bc2bc2c52d98bcf2bd67ba6c5015',
      '/_blob/fe9fcc2f094f1cbbf4780a4796eeede6',
      '/_blob/f8563820227b0798d7ef0e62c25d9b8e',
      '/_blob/a63dad432693b941e61909b2313794c6',
      '/_blob/78c79d297bbdaca566a4402e54377f3c',
      '/_blob/e302abcc3310c7bec132590aea4a0799',
      '/_blob/ed0865b4e5a798f543d4ce637b3fa904',
      '/_blob/ec4bc93f52051c07b4eab72390663cdf',
      '/_blob/a4ddd49a163944b93b7873182c24aef2',
      '/_blob/6c0f34667f4d2a4682e87137869a5d43',
      '/_blob/041658b4287cea8220163d9fb2b9ae3a',
      '/_blob/7d9030aeed420832ffd5885e89940639',
    ];
    const half = current.cards / 2;
    const pattern = [];
    for (let i = 0; i < half; i++) pattern.push((i % CARD_IMAGES.length) + 1);
    for (let i = 0; i < half; i++) pattern.push((i % CARD_IMAGES.length) + 1);
    const secondIdx = pattern.lastIndexOf(pattern[0]);
    const matchedStyle = 'position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:6px;background:#ffffff;box-shadow:inset 0 0 0 3px #035A2C';
    const activeStyle = 'position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:6px;background:#ffffff;box-shadow:inset 0 0 0 3px #029ADB';
    const backStyle = 'aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#0E4793;border:1px solid #09306A';
    const backMark = 'display:block;width:14px;height:14px;border:2px solid rgba(255,255,255,.55);border-radius:3px;transform:rotate(45deg)';
    const cards = pattern.map((value, i) => {
      const isMatched = i === 0 || i === secondIdx;
      const isActive = i === 1;
      const isFaceUp = isMatched || isActive;
      return {
        key: i,
        value,
        img: CARD_IMAGES[value - 1],
        isFaceUp,
        isBack: !isFaceUp,
        cardStyle: isMatched ? matchedStyle : isActive ? activeStyle : backStyle,
        backMark,
      };
    });
    return {
      levels,
      current,
      cards,
    };
  }
}
</script>
</body>
</html>
